spring.application.name=KP_Chess

# ---------------------------------------------------------------
# Сервер. PORT задают многие хостинги (Render, Railway, Heroku...)
# ---------------------------------------------------------------
server.address=0.0.0.0
server.port=${PORT:8080}
# За прокси хостинга (https -> http внутри контейнера)
server.forward-headers-strategy=framework

# ---------------------------------------------------------------
# PostgreSQL. Все значения берутся из переменных окружения,
# в репозитории секретов нет. Значения по умолчанию - для локальной разработки.
# Для Neon/Supabase: DB_PARAMS=?sslmode=require
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buh3}${DB_PARAMS:}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Облачные БД (Neon) усыпляют соединения при простое: не держим их долго
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------------------------------------
# Схема БД создаётся миграциями Flyway (src/main/resources/db/migration),
# Hibernate её только проверяет. Если БД уже была создана старой версией
# приложения (ddl-auto=update), Flyway сам "встанет" поверх неё.
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------
# Токены авторизации. ОБЯЗАТЕЛЬНО задайте AUTH_SECRET (минимум 32 символа)
# на сервере, иначе при каждом перезапуске будет генерироваться новый
# ключ и все пользователи будут разлогинены.
# Сгенерировать: openssl rand -base64 48
# ---------------------------------------------------------------
app.auth.secret=${AUTH_SECRET:}
app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:720}

# ---------------------------------------------------------------
# Служебное
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

logging.level.root=INFO
